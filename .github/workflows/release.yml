name: release
# A tag like v0.1.0 builds the launcher (the installer people download) for each system and attaches it to a GitHub release.
# Only Linux is published. The Windows (.exe) and macOS (.dmg) installers build fine (add `{ os: windows-2022, uv: win }` and `{ os: macos-14, uv: mac }` to the matrix, and their files to
# the two lists below) but are not published until they are signed: unsigned, both systems block or flag them. See launcher/README.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, uv: linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm test
      - run: npm run download -- ${{ matrix.uv }}
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            launcher/dist/*.AppImage
            launcher/dist/*.deb
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            launcher/dist/*.AppImage
            launcher/dist/*.deb
