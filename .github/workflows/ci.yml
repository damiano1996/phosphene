name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web client (tests and lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test
        working-directory: web
      - run: npx --yes eslint@9 .
        working-directory: web

  launcher:
    name: Launcher (the install plan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test test/*.test.js
        working-directory: launcher

  engine:
    name: Engine (tests and lint, no GPU, no PyTorch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pytest ruff
      - run: ruff check engine
      - run: python -m pytest engine/tests
